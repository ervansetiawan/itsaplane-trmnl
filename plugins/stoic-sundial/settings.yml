name: Stoic Sundial
description: Solar horizon, year matrix & Stoic
strategy: polling
polling_url: https://itsaplane-trmnl.onrender.com/stoic/daily?lat={{ lat }}&lon={{ lon }}
polling_verb: get
polling_headers: ""
framework_version: 3.4
refresh_interval: 60
dark_mode: "no"
no_screen_padding: "no"
custom_fields:
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    category: education
    description: Solar horizon, year matrix & Stoic
    github_url: https://github.com/ervansetiawan/itsaplane-trmnl
    email_address: ervansetiawan@gmail.com
  - keyname: lat
    field_type: string
    name: Latitude (Optional)
    description: Latitude for local solar horizon (default 41.88).
    default: "41.88"
  - keyname: lon
    field_type: string
    name: Longitude (Optional)
    description: Longitude for local solar horizon (default -87.63).
    default: "-87.63"
